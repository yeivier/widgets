<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conversor CLP</title>
<meta name="description" content="Conversor rápido de Reales, Dólares y USDT a Pesos chilenos y viceversa, con tasas en vivo.">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conv $">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root{
    --bg:#0b1220; --card:#121b2e; --card2:#0f1729; --text:#eef2f8; --muted:#8b96ab;
    --accent:#22c55e; --accent2:#14b8a6; --line:#1e293f; --danger:#f87171;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --card:#ffffff; --card2:#eef1f8; --text:#101625; --muted:#5b6478; --line:#e1e6f0; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{overflow:hidden;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
    height:var(--app-h, 100dvh);
    overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 2px; flex:none;
  }
  header h1{font-size:15px; font-weight:600; margin:0; color:var(--muted); letter-spacing:.02em;}
  /* Cuando el teclado achica el viewport visible, se compacta todo para que
     nunca haga falta desplazarse: se pierde lo decorativo, no lo funcional. */
  body.kb-open header h1{ display:none; }
  body.kb-open header{ padding:4px 18px 0; }
  body.kb-open .tabs{ padding:0 14px 4px; }
  body.kb-open .tab{ padding:6px 8px; font-size:11.5px; }
  body.kb-open .field{ padding:8px 16px; border-radius:16px; }
  body.kb-open input.amount{ font-size: clamp(22px, 8vw, 34px); }
  body.kb-open .name{ display:none; }
  body.kb-open .swapWrap{ margin:-2px 0; }
  body.kb-open #swapBtn{ width:30px; height:30px; }
  body.kb-open footer{ padding:2px 18px calc(4px + env(safe-area-inset-bottom)); }
  body.kb-open .status{ font-size:11px; }
  body.kb-open .totalBar{ padding:5px 14px; }
  body.kb-open .totalText{ font-size:12px; }
  body.kb-open .tallyBtn{ width:30px; height:30px; font-size:16px; }
  #refreshBtn{
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px 10px;
    cursor:pointer; border-radius:10px; line-height:1;
  }
  #refreshBtn:active{background:var(--card2);}
  #refreshBtn.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .tabs{
    display:flex; gap:6px; padding:2px 14px 8px; overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1; min-width:0; white-space:nowrap; text-align:center;
    background:var(--card2); border:1px solid var(--line); color:var(--muted);
    font-size:13px; font-weight:600; padding:9px 10px; border-radius:12px; cursor:pointer;
  }
  .tab.active{ background:var(--accent2); border-color:var(--accent2); color:#04211c; }

  main{flex:1; display:flex; flex-direction:column; padding:6px 14px 10px; gap:10px;}
  .field{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:14px 18px; flex:1; display:flex; flex-direction:column; justify-content:center;
    min-height:0;
  }
  .field .row{display:flex; align-items:center; gap:10px;}
  .flag{font-size:26px; line-height:1; width:32px; text-align:center; flex:none;}
  .label{display:flex; flex-direction:column; margin-right:2px; min-width:0;}
  .code{font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--muted);}
  .name{font-size:11px; color:var(--muted); opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  input.amount{
    flex:1; min-width:0; background:transparent; border:none; outline:none; text-align:right;
    color:var(--text); font-size:clamp(28px, 10vw, 52px); font-weight:700; font-variant-numeric:tabular-nums;
    caret-color:var(--accent);
  }
  input.amount::placeholder{color:var(--muted); opacity:.5;}
  .clearBtn{
    background:var(--card2); border:none; color:var(--muted); width:26px; height:26px; border-radius:50%;
    font-size:14px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer;
  }
  .clearBtn[hidden]{display:none;}
  .swapWrap{display:flex; align-items:center; justify-content:center; gap:14px; margin:-4px 0;}
  #swapBtn{
    background:var(--card2); border:1px solid var(--line); color:var(--accent2);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:1;
  }
  #swapBtn:active{transform:scale(.92);}
  .tallyBtn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card2);
    font-size:18px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
  }
  .tallyBtn:active{transform:scale(.92);}
  #subBtn{ color:var(--danger); }
  #addBtn{ color:var(--accent); }
  .totalBar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:7px 18px; flex:none; border-top:1px solid var(--line);
  }
  .totalBar[hidden]{display:none;}
  .totalBar{flex-direction:column; gap:2px; padding:6px 18px;}
  .totalRow{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;}
  .totalText{font-size:13px; color:var(--muted); text-align:center;}
  .totalText b{color:var(--text); font-weight:700;}
  .historyList{
    list-style:none; margin:2px 0 0; padding:0; width:100%; max-height:88px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .historyList li{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:11.5px; color:var(--muted); padding:2px 0;
  }
  .historyList .sign{font-weight:700; width:12px; text-align:center; flex:none;}
  .historyList .sign.pos{color:var(--accent);}
  .historyList .sign.neg{color:var(--danger);}
  body.kb-open .historyList{max-height:52px;}
  .totalText .arrow{color:var(--muted); margin:0 2px;}
  #resetTotalBtn{
    background:none; border:none; color:var(--muted); font-size:15px; padding:4px 6px;
    cursor:pointer; line-height:1; flex:none;
  }
  footer{padding:8px 18px calc(14px + env(safe-area-inset-bottom));}
  .status{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
    justify-content:center; text-align:center;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
  .dot.stale{background:#eab308;}
  .dot.off{background:var(--danger);}
  #statusText b{color:var(--text); font-weight:600;}
</style>
</head>
<body>
  <header>
    <h1>Conversor en vivo</h1>
    <button id="refreshBtn" aria-label="Actualizar tasa" title="Actualizar tasa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <div class="field" id="fieldFrom">
      <div class="row">
        <span class="flag" id="flagFrom"></span>
        <div class="label"><span class="code" id="codeFrom"></span><span class="name" id="nameFrom"></span></div>
        <input class="amount" id="amountFrom" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Monto origen">
        <button class="clearBtn" id="clearFrom" hidden aria-label="Limpiar">✕</button>
      </div>
    </div>

    <div class="swapWrap">
      <button class="tallyBtn" id="subBtn" aria-label="Restar esta conversión al acumulado" title="Restar al acumulado">−</button>
      <button id="swapBtn" aria-label="Intercambiar" title="Intercambiar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="tallyBtn" id="addBtn" aria-label="Sumar esta conversión al acumulado" title="Sumar al acumulado">+</button>
    </div>

    <div class="field" id="fieldTo">
      <div class="row">
        <span class="flag" id="flagTo"></span>
        <div class="label"><span class="code" id="codeTo"></span><span class="name" id="nameTo"></span></div>
        <input class="amount" id="amountTo" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Monto destino">
        <button class="clearBtn" id="clearTo" hidden aria-label="Limpiar">✕</button>
      </div>
    </div>
  </main>

  <div class="totalBar" id="totalBar" hidden>
    <div class="totalRow">
      <span class="totalText" id="totalText"></span>
      <button id="resetTotalBtn" aria-label="Reiniciar acumulado" title="Reiniciar acumulado">↺</button>
    </div>
    <ul class="historyList" id="historyList"></ul>
  </div>

  <footer>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Cargando tasa…</span>
    </div>
  </footer>

<script>
(function(){
  "use strict";

  // ---------- catálogo de monedas ----------
  var CUR = {
    BRL:  { code:"BRL",  name:"Real brasileño",           flag:"🇧🇷", decimals:2 },
    CLP:  { code:"CLP",  name:"Peso chileno",              flag:"🇨🇱", decimals:0 },
    USD:  { code:"USD",  name:"Dólar estadounidense",      flag:"🇺🇸", decimals:2 },
    USDT: { code:"USDT", name:"Tether (USDT)",             flag:"₮",  decimals:2 }
  };

  function fetchWithTimeout(url, ms){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, ms);
    return fetch(url, { signal: ctrl.signal, cache: "no-store" }).finally(function(){ clearTimeout(t); });
  }
  function getJSON(url, ms){
    return fetchWithTimeout(url, ms || 5000).then(function(r){
      if(!r.ok) throw new Error("bad status " + r.status);
      return r.json();
    });
  }

  // Cotización de mercado real (la misma clase de dato que muestra el
  // conversor de Google al buscar) vía Yahoo Finance. No hay API pública de
  // Google Finance ni forma de usar Yahoo directo desde el navegador (CORS),
  // así que se pasa por un proxy público sin necesidad de registrarse en
  // nada. Si el proxy falla, se cae a las fuentes diarias de siempre.
  function yahooRate(symbol){
    var target = "https://query1.finance.yahoo.com/v8/finance/chart/" + symbol;
    function parse(j){
      var p = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta && j.chart.result[0].meta.regularMarketPrice;
      if(typeof p === "number") return p;
      throw new Error("no regularMarketPrice");
    }
    return getJSON("https://corsproxy.io/?url=" + encodeURIComponent(target), 4000)
      .then(parse)
      .catch(function(){
        return getJSON("https://api.allorigins.win/raw?url=" + encodeURIComponent(target), 4000).then(parse);
      });
  }

  // ---------- pares de conversión ----------
  var PAIRS = [
    {
      id: "brl_clp", tabLabel: "BRL ⇄ CLP", from: CUR.BRL, to: CUR.CLP, freshMs: 5*60*1000,
      fetchRate: function(){
        return yahooRate("BRLCLP=X").catch(function(){
        return getJSON("https://open.er-api.com/v6/latest/BRL")
          .then(function(j){ if(j && j.rates && typeof j.rates.CLP === "number") return j.rates.CLP; throw new Error("no CLP"); })
          .catch(function(){
            return getJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/brl.json")
              .then(function(j){ if(j && j.brl && typeof j.brl.clp === "number") return j.brl.clp; throw new Error("no clp"); });
          })
          .catch(function(){
            return getJSON("https://latest.currency-api.pages.dev/v1/currencies/brl.json")
              .then(function(j){ if(j && j.brl && typeof j.brl.clp === "number") return j.brl.clp; throw new Error("no clp"); });
          });
        });
      }
    },
    {
      id: "usd_clp", tabLabel: "USD ⇄ CLP", from: CUR.USD, to: CUR.CLP, freshMs: 5*60*1000,
      fetchRate: function(){
        return yahooRate("USDCLP=X").catch(function(){
        return getJSON("https://open.er-api.com/v6/latest/USD")
          .then(function(j){ if(j && j.rates && typeof j.rates.CLP === "number") return j.rates.CLP; throw new Error("no CLP"); })
          .catch(function(){
            return getJSON("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json")
              .then(function(j){ if(j && j.usd && typeof j.usd.clp === "number") return j.usd.clp; throw new Error("no clp"); });
          })
          .catch(function(){
            return getJSON("https://latest.currency-api.pages.dev/v1/currencies/usd.json")
              .then(function(j){ if(j && j.usd && typeof j.usd.clp === "number") return j.usd.clp; throw new Error("no clp"); });
          });
        });
      }
    },
    {
      id: "usdt_usd", tabLabel: "USDT ⇄ USD", from: CUR.USDT, to: CUR.USD, freshMs: 15*60*1000,
      fetchRate: function(){
        // fuentes de mercado cripto: se actualizan en segundos/minutos, mucho más "en vivo" que el forex gratuito
        return getJSON("https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd")
          .then(function(j){ if(j && j.tether && typeof j.tether.usd === "number") return j.tether.usd; throw new Error("no usd"); })
          .catch(function(){
            return getJSON("https://api.coinbase.com/v2/prices/USDT-USD/spot")
              .then(function(j){
                var n = j && j.data && parseFloat(j.data.amount);
                if(isFinite(n)) return n;
                throw new Error("no amount");
              });
          })
          .catch(function(){
            return getJSON("https://min-api.cryptocompare.com/data/price?fsym=USDT&tsyms=USD")
              .then(function(j){ if(j && typeof j.USD === "number") return j.USD; throw new Error("no USD"); });
          });
      }
    }
  ];

  var LS_PAIR = "conv_last_pair_v2";
  var STALE_MS = 30 * 24 * 60 * 60 * 1000; // 30 días máx para seguir mostrando algo

  var tabsEl = document.getElementById("tabs");
  var amountFrom = document.getElementById("amountFrom");
  var amountTo = document.getElementById("amountTo");
  var clearFrom = document.getElementById("clearFrom");
  var clearTo = document.getElementById("clearTo");
  var swapBtn = document.getElementById("swapBtn");
  var addBtn = document.getElementById("addBtn");
  var subBtn = document.getElementById("subBtn");
  var totalBar = document.getElementById("totalBar");
  var totalText = document.getElementById("totalText");
  var resetTotalBtn = document.getElementById("resetTotalBtn");
  var refreshBtn = document.getElementById("refreshBtn");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var fieldFrom = document.getElementById("fieldFrom");
  var fieldTo = document.getElementById("fieldTo");
  var flagFrom = document.getElementById("flagFrom"), codeFrom = document.getElementById("codeFrom"), nameFrom = document.getElementById("nameFrom");
  var flagTo = document.getElementById("flagTo"), codeTo = document.getElementById("codeTo"), nameTo = document.getElementById("nameTo");

  var historyList = document.getElementById("historyList");

  var pairIndex = 0;
  var state = { rate: null, ts: null, syncing: false, lastEdited: "from", history: [] };

  // ---------- utils ----------
  function parseNum(str){
    if(!str) return NaN;
    var s = String(str).trim().replace(/\./g, "").replace(",", ".");
    if (/^\d+\.\d{1,2}$/.test(String(str).trim()) && String(str).indexOf(",") === -1) {
      s = String(str).trim();
    }
    return parseFloat(s);
  }
  function fmt(n, decimals){
    if(!isFinite(n)) return "";
    return n.toLocaleString("es-CL", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function pair(){ return PAIRS[pairIndex]; }
  function lsKeyRate(){ return "conv_rate_" + pair().id + "_v1"; }
  function lsKeyVals(){ return "conv_vals_" + pair().id + "_v1"; }
  function lsKeyTotal(){ return "conv_total_" + pair().id + "_v1"; }

  function saveVals(){
    try{ localStorage.setItem(lsKeyVals(), JSON.stringify({from: amountFrom.value, to: amountTo.value})); }catch(e){}
  }
  function loadVals(){
    try{ return JSON.parse(localStorage.getItem(lsKeyVals()) || "null"); }catch(e){ return null; }
  }
  function saveRate(rate, ts){
    try{ localStorage.setItem(lsKeyRate(), JSON.stringify({rate: rate, ts: ts})); }catch(e){}
  }
  function loadRate(){
    try{ return JSON.parse(localStorage.getItem(lsKeyRate()) || "null"); }catch(e){ return null; }
  }
  function saveHistory(){
    try{ localStorage.setItem(lsKeyTotal(), JSON.stringify(state.history)); }catch(e){}
  }
  function loadHistory(){
    try{
      var v = JSON.parse(localStorage.getItem(lsKeyTotal()) || "null");
      return Array.isArray(v) ? v : [];
    }catch(e){ return []; }
  }
  function relTime(ts){
    var diff = Date.now() - ts;
    var min = Math.round(diff / 60000);
    if (min < 1) return "recién";
    if (min < 60) return "hace " + min + " min";
    var h = Math.round(min / 60);
    if (h < 24) return "hace " + h + " h";
    var d = Math.round(h / 24);
    return "hace " + d + " d";
  }

  // ---------- conversion ----------
  function recompute(source){
    if(!state.rate) return;
    state.syncing = true;
    var p = pair();
    if(source === "from"){
      var a = parseNum(amountFrom.value);
      amountTo.value = isFinite(a) && amountFrom.value !== "" ? fmt(a * state.rate, p.to.decimals) : "";
    } else {
      var b = parseNum(amountTo.value);
      amountFrom.value = isFinite(b) && amountTo.value !== "" ? fmt(b / state.rate, p.from.decimals) : "";
    }
    state.syncing = false;
    clearFrom.hidden = !amountFrom.value;
    clearTo.hidden = !amountTo.value;
    saveVals();
  }

  // ---------- acumulado (sumar/restar conversiones), con detalle ----------
  function renderTotal(){
    var p = pair();
    var hasHistory = state.history.length > 0;
    totalBar.hidden = !hasHistory;
    if(!hasHistory){ historyList.innerHTML = ""; return; }

    var totalFrom = 0, totalTo = 0;
    var rows = state.history.map(function(e){
      totalFrom += e.from; totalTo += e.to;
      var pos = e.from >= 0;
      return "<li><span class=\"sign " + (pos ? "pos\">+" : "neg\">−") + "</span>" +
        fmt(Math.abs(e.from), p.from.decimals) + " " + p.from.code +
        "<span class=\"arrow\">→</span>" + fmt(Math.abs(e.to), p.to.decimals) + " " + p.to.code + "</li>";
    });

    totalText.innerHTML = "Acumulado: <b>" + fmt(totalFrom, p.from.decimals) + "</b> " + p.from.code +
      "<span class=\"arrow\">→</span><b>" + fmt(totalTo, p.to.decimals) + "</b> " + p.to.code;
    historyList.innerHTML = rows.join("");
    historyList.scrollTop = historyList.scrollHeight; // siempre a la vista lo último sumado
  }
  function tally(sign){
    var a = parseNum(amountFrom.value);
    var b = parseNum(amountTo.value);
    if(!isFinite(a) || !isFinite(b)) return; // nada que sumar/restar todavía
    state.history.push({ from: sign * a, to: sign * b });
    saveHistory();
    renderTotal();
  }
  addBtn.addEventListener("click", function(){ tally(1); });
  subBtn.addEventListener("click", function(){ tally(-1); });
  resetTotalBtn.addEventListener("click", function(){
    state.history = [];
    saveHistory();
    renderTotal();
  });

  amountFrom.addEventListener("input", function(){
    if(state.syncing) return;
    state.lastEdited = "from";
    recompute("from");
  });
  amountTo.addEventListener("input", function(){
    if(state.syncing) return;
    state.lastEdited = "to";
    recompute("to");
  });

  clearFrom.addEventListener("click", function(){ amountFrom.value=""; amountTo.value=""; clearFrom.hidden=true; clearTo.hidden=true; saveVals(); amountFrom.focus({preventScroll:true}); });
  clearTo.addEventListener("click", function(){ amountFrom.value=""; amountTo.value=""; clearFrom.hidden=true; clearTo.hidden=true; saveVals(); amountTo.focus({preventScroll:true}); });

  swapBtn.addEventListener("click", function(){
    var main = document.querySelector("main");
    if (fieldFrom.compareDocumentPosition(fieldTo) & Node.DOCUMENT_POSITION_FOLLOWING) {
      main.insertBefore(fieldTo, fieldFrom);
    } else {
      main.insertBefore(fieldFrom, fieldTo);
    }
    // preventScroll es clave: sin esto Safari centra el input en el viewport
    // visible y "empuja" la página hacia abajo cada vez que tocás el botón.
    (state.lastEdited === "from" ? amountFrom : amountTo).focus({preventScroll:true});
  });

  // ---------- tabs ----------
  // Los botones se crean una sola vez (buildTabs); cambiar de pestaña solo
  // alterna la clase "active", no reconstruye el DOM.
  function buildTabs(){
    tabsEl.innerHTML = "";
    PAIRS.forEach(function(p, i){
      var b = document.createElement("button");
      b.className = "tab";
      b.textContent = p.tabLabel;
      b.addEventListener("click", function(){ if(i !== pairIndex) selectPair(i); });
      tabsEl.appendChild(b);
    });
  }
  function markActiveTab(){
    var buttons = tabsEl.children;
    for(var i=0; i<buttons.length; i++){
      buttons[i].classList.toggle("active", i === pairIndex);
    }
  }

  function renderFields(){
    var p = pair();
    flagFrom.textContent = p.from.flag; codeFrom.textContent = p.from.code; nameFrom.textContent = p.from.name;
    flagTo.textContent = p.to.flag; codeTo.textContent = p.to.code; nameTo.textContent = p.to.name;
    amountFrom.setAttribute("aria-label", "Monto en " + p.from.name);
    amountTo.setAttribute("aria-label", "Monto en " + p.to.name);
    // asegurar orden natural from/to tras un swap previo
    var main = document.querySelector("main");
    if (fieldFrom.compareDocumentPosition(fieldTo) & Node.DOCUMENT_POSITION_PRECEDING) {
      main.insertBefore(fieldFrom, fieldTo);
    }
  }

  function selectPair(i){
    pairIndex = i;
    try{ localStorage.setItem(LS_PAIR, String(i)); }catch(e){}
    state.rate = null; state.ts = null; state.lastEdited = "from";
    markActiveTab();
    renderFields();

    var cached = loadRate();
    if(cached && cached.rate && (Date.now() - cached.ts) < STALE_MS){
      state.rate = cached.rate; state.ts = cached.ts;
    }
    var vals = loadVals();
    amountFrom.value = (vals && vals.from) || "";
    amountTo.value = (vals && vals.to) || "";
    clearFrom.hidden = !amountFrom.value;
    clearTo.hidden = !amountTo.value;

    state.history = loadHistory();
    renderTotal();

    updateStatus();
    amountFrom.focus({preventScroll:true});
    if(amountFrom.value) amountFrom.select();
    refreshRate(false);
  }

  // ---------- status UI ----------
  function updateStatus(){
    var p = pair();
    if(!state.rate){
      dot.className = "dot off";
      statusText.textContent = navigator.onLine ? "Cargando tasa…" : "Sin conexión y sin datos guardados";
      return;
    }
    var age = Date.now() - state.ts;
    dot.className = "dot" + (age > p.freshMs ? " stale" : "");
    if (!navigator.onLine) dot.className = "dot off";
    statusText.innerHTML = "1 " + p.from.code + " = <b>" + fmt(state.rate, p.to.decimals === 0 ? 2 : p.to.decimals) + "</b> " + p.to.code + " · " + relTime(state.ts) + (navigator.onLine ? "" : " · sin conexión");
  }
  setInterval(updateStatus, 30000);

  function refreshRate(showSpin){
    var p = pair();
    if(showSpin) refreshBtn.classList.add("spin");
    return p.fetchRate()
      .then(function(rate){
        if (pair().id !== p.id) return; // el usuario cambió de pestaña mientras cargaba
        var ts = Date.now();
        state.rate = rate;
        state.ts = ts;
        saveRate(rate, ts);
        recompute(state.lastEdited);
        updateStatus();
      })
      .catch(function(){ updateStatus(); })
      .finally(function(){ if(showSpin) refreshBtn.classList.remove("spin"); });
  }

  refreshBtn.addEventListener("click", function(){ refreshRate(true); });
  window.addEventListener("online", function(){ refreshRate(false); updateStatus(); });
  window.addEventListener("offline", updateStatus);

  // Auto-actualiza la tasa cada 1 minuto mientras la app está en primer
  // plano, y también al volver a ella (cambiar de app y volver, desbloquear
  // el celular, etc). Así siempre se muestra el dato más fresco disponible
  // en la fuente, sin esperar a que el usuario toque el botón de refrescar.
  setInterval(function(){ if(!document.hidden) refreshRate(false); }, 60000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refreshRate(false);
  });

  // ---------- boot ----------
  (function boot(){
    var savedIdx = 0;
    try{
      var raw = localStorage.getItem(LS_PAIR);
      if(raw !== null){ var n = parseInt(raw, 10); if(n >= 0 && n < PAIRS.length) savedIdx = n; }
    }catch(e){}
    buildTabs();
    selectPair(savedIdx);
  })();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }

  // ---------- alto real de la pantalla (teclado incluido) ----------
  // 100dvh no siempre se achica cuando aparece el teclado en iOS/Safari
  // standalone, así que el contenido puede terminar más alto que lo visible
  // y forzar scroll. Acá se fija el alto real de la ventana visible (la que
  // queda arriba del teclado) y se activa un modo compacto cuando se reduce
  // bastante, para que todo siga entrando sin desplazarse.
  function setAppHeight(){
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty("--app-h", h + "px");
    var shrunk = (window.innerHeight - h) > 90; // heurística: teclado probablemente abierto
    document.body.classList.toggle("kb-open", shrunk);
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", setAppHeight);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", setAppHeight);
    window.visualViewport.addEventListener("scroll", setAppHeight);
  }
})();
</script>
</body>
</html>
